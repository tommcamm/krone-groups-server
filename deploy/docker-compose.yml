services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: krone-groups-server:local
    restart: unless-stopped
    volumes:
      - server_data:/data
    environment:
      KRONE_BIND: "0.0.0.0:8080"
      KRONE_DATA_DIR: "/data"
      KRONE_SERVER_SEED: "${KRONE_SERVER_SEED:-}"
      KRONE_TTL_SECONDS: "${KRONE_TTL_SECONDS:-2592000}"
      KRONE_MAX_ENVELOPE_BYTES: "${KRONE_MAX_ENVELOPE_BYTES:-65536}"
      KRONE_MAX_INBOX_PER_DEVICE: "${KRONE_MAX_INBOX_PER_DEVICE:-10000}"
      KRONE_MAX_ENVELOPES_PER_DEVICE_PER_HOUR: "${KRONE_MAX_ENVELOPES_PER_DEVICE_PER_HOUR:-600}"
      KRONE_CLOCK_SKEW_SECONDS: "${KRONE_CLOCK_SKEW_SECONDS:-120}"
      RUST_LOG: "${RUST_LOG:-info}"
    expose:
      - "8080"
    # No ports published directly — Caddy terminates TLS and reverse-proxies.
    healthcheck:
      # The distroless runtime has no shell or curl — the binary probes itself.
      test: ["CMD", "/usr/local/bin/krone-groups-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Mounted in every mode. In `letsencrypt` mode it is unused; in `custom`
      # mode it must contain fullchain.pem + privkey.pem before starting Caddy.
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: "${DOMAIN}"
      TLS_EMAIL: "${TLS_EMAIL:-}"
      KRONE_TLS_MODE: "${KRONE_TLS_MODE:-letsencrypt}"

volumes:
  server_data:
  caddy_data:
  caddy_config:
